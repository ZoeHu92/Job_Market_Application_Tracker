name: Tests

on:
  push:
    paths: ["tracker/**", "tests/**", "app.py", "config/**", "requirements.txt", ".github/workflows/tests.yml"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
        env:
          TRACKER_NO_AUTO_UPDATE: "1"
