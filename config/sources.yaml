# Job boards scraped every week.
#
#   kind: board          generic crawler: RSS/Atom feeds and/or listing pages, then each new
#                        posting's page (schema.org JobPosting data + labeled fields + text)
#   kind: joe            AEA JOE official XML export (all listings in one request)
#   kind: econjobmarket  EconJobMarket's public JSON feed of open ads
#
#   filter: none      keep every posting
#           faculty   drop staff/administrative jobs
#           business  faculty jobs at business schools / in business fields only (broad boards)
#   feed_style        madgex (title "Employer: Job") | higheredjobs ("Institution (City)")
#   feed_page_param   query parameter for feed page 2, 3, ...
#   partial_listing   the feed shows only the newest N postings, so a posting missing from it
#                     is not treated as closed (it closes on its deadline / listing expiry instead)
#   verify_closures   false = the feed lists every open ad, so a missing ad is closed directly
#   day_first         true = numeric dates are day/month/year (05/11/2026 = 5 November), as on
#                     European and Australian boards; otherwise each posting's own dates decide
#   verified          date the configuration was last checked against the live site
#
# Boards marked "enabled: false" refuse automated access (bot challenge or member login).
# Import their postings from a saved page in the app (Add jobs), or read their e-mail alerts.

sources:
  # ---- Finance -------------------------------------------------------------------------
  - name: AFA
    label: American Finance Association career center
    homepage: https://careers.afajof.org/
    kind: board
    enabled: true
    default_field: Finance
    filter: faculty
    feeds: ["https://careers.afajof.org/jobsrss/"]
    feed_style: madgex
    feed_page_param: Page
    job_link_pattern: 'careers\.afajof\.org/job/(\d+)'
    verified: "2026-10-28"

  - name: FMA
    label: Financial Management Association placement (members-only; use FMA job-alert emails)
    homepage: https://www.fma.org/for-job-seekers
    kind: board
    enabled: false
    verified: "2026-10-28"

  # ---- Economics boards with many business-school postings -------------------------------
  - name: JOE
    label: AEA Job Openings for Economists (business-school listings)
    homepage: https://www.aeaweb.org/joe/listings
    kind: joe
    enabled: true
    verified: "2026-10-28"

  - name: EJM
    label: EconJobMarket (business-school listings)
    homepage: https://econjobmarket.org/positions
    kind: econjobmarket
    enabled: true
    api_url: https://backend.econjobmarket.org/data/zz_public/json/Ads
    verify_closures: false   # the feed lists every open ad, so a missing ad is closed
    verified: "2026-10-28"

  # ---- Accounting --------------------------------------------------------------------------
  - name: AAA
    label: American Accounting Association career center
    homepage: https://careercenter.aaahq.org/
    kind: board
    enabled: true
    default_field: Accounting
    filter: faculty
    feeds: ["https://careercenter.aaahq.org/jobsrss/"]
    feed_style: madgex
    feed_page_param: Page
    job_link_pattern: 'careercenter\.aaahq\.org/job/(\d+)'
    verified: "2026-10-28"

  # ---- General academic boards (business-school jobs only) -------------------------------
  - name: Chronicle
    label: Chronicle of Higher Education jobs (business & management faculty)
    homepage: https://jobs.chronicle.com/jobs/business-and-management/
    kind: board
    enabled: true
    filter: business
    feeds: ["https://jobs.chronicle.com/jobsrss/?PositionType=9&Keywords=professor"]
    feed_style: madgex
    feed_page_param: Page
    job_link_pattern: 'jobs\.chronicle\.com/job/(\d+)'
    verified: "2026-10-28"

  - name: InsideHigherEd
    label: Inside Higher Ed careers (business & management faculty)
    homepage: https://careers.insidehighered.com/jobs/business-and-management/
    kind: board
    enabled: true
    filter: business
    feeds: ["https://careers.insidehighered.com/jobsrss/?FacultyJobs=39"]
    feed_style: madgex
    feed_page_param: Page
    job_link_pattern: 'careers\.insidehighered\.com/job/(\d+)'
    verified: "2026-10-28"

  - name: THE
    label: Times Higher Education unijobs (business & economics; UK, Europe, Asia, Australia)
    homepage: https://www.timeshighereducation.com/unijobs/listings/business-and-economics/
    kind: board
    enabled: true
    filter: business
    # robots.txt disallows THE's RSS feed but allows the listing pages
    start_urls: ["https://www.timeshighereducation.com/unijobs/listings/business-and-economics/"]
    max_pages: 15
    job_link_pattern: 'timeshighereducation\.com/unijobs/listing/(\d+)'
    day_first: true
    verified: "2026-10-28"

  - name: Akadeus
    label: AKADEUS, business-school faculty positions worldwide (mostly Europe, Asia, Middle East)
    homepage: https://akadeus.com/announcements
    kind: board
    enabled: true
    filter: business
    # One page lists every open announcement as a card; each posting's page has the full text.
    start_urls: ["https://akadeus.com/announcements"]
    max_pages: 5
    job_link_pattern: 'akadeus\.com/announcement/(\d+)'
    day_first: true
    verified: "2026-10-29"

  - name: HigherEdJobs
    label: HigherEdJobs business faculty categories
    homepage: https://www.higheredjobs.com/faculty/
    kind: board
    enabled: true
    filter: business
    feed_style: higheredjobs
    fetch_details: false    # posting pages answer with a bot check; the feed gives title, school, place
    partial_listing: true   # each category feed shows only its newest 100 postings
    feeds:
      - "https://www.higheredjobs.com/rss/categoryFeed.cfm?catID=44"    # Finance
      - "https://www.higheredjobs.com/rss/categoryFeed.cfm?catID=45"    # Accounting
      - "https://www.higheredjobs.com/rss/categoryFeed.cfm?catID=46"    # Management
      - "https://www.higheredjobs.com/rss/categoryFeed.cfm?catID=47"    # Marketing and Sales
      - "https://www.higheredjobs.com/rss/categoryFeed.cfm?catID=144"   # Information Systems
      - "https://www.higheredjobs.com/rss/categoryFeed.cfm?catID=285"   # Business Analytics
      - "https://www.higheredjobs.com/rss/categoryFeed.cfm?catID=286"   # Real Estate
      - "https://www.higheredjobs.com/rss/categoryFeed.cfm?catID=255"   # Entrepreneurship
      - "https://www.higheredjobs.com/rss/categoryFeed.cfm?catID=229"   # International Business
      - "https://www.higheredjobs.com/rss/categoryFeed.cfm?catID=203"   # Human Resources
      - "https://www.higheredjobs.com/rss/categoryFeed.cfm?catID=228"   # Business Law
      - "https://www.higheredjobs.com/rss/categoryFeed.cfm?catID=256"   # Business Administration
      - "https://www.higheredjobs.com/rss/categoryFeed.cfm?catID=48"    # Other Business
    job_link_pattern: 'JobCode=(\d+)'
    verified: "2026-10-28"

  - name: AJO
    label: AcademicJobsOnline (business-school listings)
    homepage: https://academicjobsonline.org/ajo/jobs
    kind: board
    enabled: true
    filter: business
    fetch_details: false     # the feed already carries the full ad text
    feeds: ["https://academicjobsonline.org/ajo?joblist-0-0-0-----rss--"]
    feed_fields:
      institution: ads_univ
      department: ads_dept
      deadline_raw: ads_deadline
      country: ads_country
      location: ads_city
      categories: ads_disciplines
    job_link_pattern: 'academicjobsonline\.org/ajo/.*?/(\d+)(?:\?rss)?$'
    verified: "2026-10-28"

  # ---- China / Greater China ------------------------------------------------------------
  - name: CES
    label: Chinese Economists Society job board (positions in China)
    homepage: https://www.china-ces.org/Job/Default.aspx
    kind: board
    enabled: true
    filter: faculty
    start_urls: ["https://www.china-ces.org/Job/Default.aspx"]
    job_link_pattern: 'ShowJob\.aspx\?ID=(\d+)'
    max_pages: 1
    verified: "2026-10-28"

  - name: SJTU-Antai
    label: SJTU Antai College of Economics and Management, faculty recruitment notices
    homepage: https://acem.sjtu.edu.cn/faculty/teacher.html
    kind: board
    enabled: true
    filter: faculty
    start_urls: ["https://acem.sjtu.edu.cn/faculty/teacher.html"]
    default_institution: Shanghai Jiao Tong University, Antai College of Economics and Management
    job_link_pattern: 'acem\.sjtu\.edu\.cn/acem/hr/(\d+)\.html'
    max_pages: 1
    partial_listing: true   # the page lists the current year's notices only
    verified: "2026-10-28"

  - name: EFN-China
    label: China Economics Education and Research Network (efnchina.com), faculty notices
    homepage: https://www.efnchina.com/zp/jxyj.htm
    kind: board
    enabled: true
    filter: business
    start_urls: ["https://www.efnchina.com/zp/jxyj.htm"]
    job_link_pattern: 'efnchina\.com/info/1111/(\d+)\.htm'
    max_pages: 1
    partial_listing: true
    verified: "2026-10-28"

  - name: School-pages
    label: Standing faculty-recruitment pages of selected schools (flagged when they change)
    kind: pages
    enabled: true
    pages:
      - url: https://www.sem.tsinghua.edu.cn/en/Faculty/Recruitment.htm
        institution: Tsinghua University School of Economics and Management
        title: Faculty positions (all departments)
        location: Beijing, China
        field: Other / General Business
      - url: https://eng.pbcsf.tsinghua.edu.cn/Faculty/Recruitment/Tenure_Track.htm
        institution: Tsinghua University PBC School of Finance
        title: Tenure-track faculty positions in finance and economics
        location: Beijing, China
        field: Finance
      - url: https://saif.sjtu.edu.cn/sxy_mobile/content/page/1771.html
        institution: Shanghai Advanced Institute of Finance (SAIF), SJTU
        title: Faculty positions at all ranks
        location: Shanghai, China
        field: Finance
    verified: "2026-10-28"

  # ---- Your mailbox: job-alert e-mails, SSRN announcements, listservs --------------------
  # Reads one folder/label over IMAP (settings: config/settings.yaml -> email). Does nothing
  # until TRACKER_IMAP_USER / TRACKER_IMAP_PASSWORD are provided; see README "Email alerts".
  - name: Email
    label: Job-alert e-mails, SSRN announcements and listservs from your mailbox
    kind: email
    enabled: true
    verified: ""

  # ---- Boards that block automated access: use their email job alerts ---------------------
  - name: AMA
    label: AMA academic placement (bot challenge; use AMA job-alert emails)
    homepage: https://academicplacement.ama.org/
    kind: board
    enabled: false
    verified: "2026-10-28"

  - name: AOM
    label: Academy of Management career center (bot challenge; use job-alert emails)
    homepage: https://career-center.aom.org/
    kind: board
    enabled: false
    verified: "2026-10-28"

  - name: INFORMS
    label: INFORMS career center (bot challenge; use job-alert emails)
    homepage: https://careercenter.informs.org/
    kind: board
    enabled: false
    verified: "2026-10-28"

  - name: AIS
    label: AIS academic careers (bot challenge; use job-alert emails)
    homepage: https://academiccareers.aisnet.org/
    kind: board
    enabled: false
    verified: "2026-10-28"

  - name: jobs.ac.uk
    label: jobs.ac.uk (bot challenge; use "Jobs by Email")
    homepage: https://www.jobs.ac.uk/search/business-and-management-studies
    kind: board
    enabled: false
    verified: "2026-10-28"
